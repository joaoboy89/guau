services:
  postgres:
    image: postgres:15-alpine
    container_name: guau_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: guau
      POSTGRES_USER: guau
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guau -d guau"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/joaoboy89/guau-api:latest
    container_name: guau_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://guau:${POSTGRES_PASSWORD}@postgres:5432/guau
      NODE_ENV: production
      PORT: 3001
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    mem_limit: 400m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/walk-types > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    image: ghcr.io/joaoboy89/guau-web:latest
    container_name: guau_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      # Whitelist a proposito (nunca env_file: .env acá): este contenedor
      # no tiene por que ver POSTGRES_PASSWORD, JWT_SECRET ni los MP_* del
      # api — ventana 2 (que puede entrar) aplicada a infra, no solo a DTOs.
      #
      # OJO — instrumentation.ts (servidor) e instrumentation-client.ts
      # (navegador) leen el MISMO nombre de variable pero por caminos
      # distintos: al navegador el valor le llega HORNEADO en el bundle por
      # el build-arg de .github/workflows/docker.yml — esta variable de
      # runtime NO puede cambiarlo. Al servidor (Next corriendo acá) sí lo
      # lee, al arrancar. Fuente de verdad del DSN que ve el navegador =
      # el build-arg, no esto. Cambiar solo esto y redeployar no mueve a
      # donde reporta el navegador, y no hay ningún error que lo delate.
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    networks:
      - internal
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:2026.6.1
    container_name: guau_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
      - web
    networks:
      - internal
    mem_limit: 128m

networks:
  internal:
    name: guau_internal
    driver: bridge

volumes:
  postgres_data:
    name: guau_postgres_data
