name: CI/CD - Guau (Staging)

on:
  push:
    branches: [staging]

concurrency:
  group: guau-deploy-staging
  cancel-in-progress: false

jobs:
  # -- 0. Correr tests (gate del pipeline) --------------------------------------
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Generar cliente de Prisma
        run: npm run prisma:generate --workspace=apps/api

      - name: Lint backend (apps/api)
        run: npm run lint --workspace=apps/api

      - name: Lint frontend (apps/web)
        run: npm run lint --workspace=apps/web

      - name: Tests backend (apps/api)
        run: npm test --workspace=apps/api

      - name: Tests frontend (apps/web)
        run: npm test --workspace=apps/web

  # -- 1. Build, Push & Deploy API a Cloud Run ----------------------------------
  deploy-api:
    name: Build & Deploy API (Staging)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/466068646039/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-staging@project-ab69c1ce-8ed0-433a-b1a.iam.gserviceaccount.com'

      - name: Configurar Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Autenticar Docker con Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: us-central1-docker.pkg.dev/project-ab69c1ce-8ed0-433a-b1a/guau-staging-repo/guau-backend:staging-${{ github.sha }}
          cache-from: type=gha,scope=api-staging
          cache-to: type=gha,mode=max,scope=api-staging

      - name: Deploy API a Cloud Run
        run: |
          gcloud run deploy guau-backend-staging \
            --image=us-central1-docker.pkg.dev/project-ab69c1ce-8ed0-433a-b1a/guau-staging-repo/guau-backend:staging-${{ github.sha }} \
            --region=us-central1 \
            --cpu=1 \
            --memory=1Gi \
            --min-instances=1 \
            --max-instances=3 \
            --concurrency=80 \
            --platform=managed \
            --add-cloudsql-instances=project-ab69c1ce-8ed0-433a-b1a:us-central1:guau-db-staging \
            --allow-unauthenticated \
            --set-secrets=DATABASE_URL=DATABASE_URL_STAGING:latest,POSTGRES_PASSWORD=POSTGRES_PASSWORD:latest,JWT_SECRET=JWT_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,JWT_EMAIL_SECRET=JWT_EMAIL_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest,FRONTEND_URL=FRONTEND_URL_STAGING:latest,MP_ACCESS_TOKEN=MP_ACCESS_TOKEN:latest,MERCADOPAGO_PUBLIC_KEY=MERCADOPAGO_PUBLIC_KEY:latest,MP_WEBHOOK_SECRET=MP_WEBHOOK_SECRET:latest,MP_CLIENT_ID=MP_CLIENT_ID:latest,MP_CLIENT_SECRET=MP_CLIENT_SECRET:latest,CLOUDFLARE_TUNNEL_TOKEN=CLOUDFLARE_TUNNEL_TOKEN:latest,EMAIL_FROM=EMAIL_FROM:latest,API_URL=API_URL:latest,SWAGGER_USER=SWAGGER_USER:latest,SWAGGER_PASSWORD=SWAGGER_PASSWORD:latest,ENCRYPTION_KEY=ENCRYPTION_KEY:latest,GH_TOKEN=GH_TOKEN:latest

      - name: Obtener URL del backend recien deployado
        id: backend-url
        run: |
          URL=$(gcloud run services describe guau-backend-staging --region=us-central1 --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
    outputs:
      backend_url: ${{ steps.backend-url.outputs.url }}

  # -- 2. Build, Push & Deploy Web a Cloud Run ----------------------------------
  deploy-web:
    name: Build & Deploy Web (Staging)
    needs: deploy-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/466068646039/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-staging@project-ab69c1ce-8ed0-433a-b1a.iam.gserviceaccount.com'

      - name: Configurar Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Autenticar Docker con Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: true
          platforms: linux/amd64
          tags: us-central1-docker.pkg.dev/project-ab69c1ce-8ed0-433a-b1a/guau-staging-repo/guau-frontend:staging-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ needs.deploy-api.outputs.backend_url }}
            NEXT_PUBLIC_WS_URL=${{ needs.deploy-api.outputs.backend_url }}
          cache-from: type=gha,scope=web-staging
          cache-to: type=gha,mode=max,scope=web-staging

      - name: Deploy Web a Cloud Run
        run: |
          gcloud run deploy guau-frontend-staging \
            --image=us-central1-docker.pkg.dev/project-ab69c1ce-8ed0-433a-b1a/guau-staging-repo/guau-frontend:staging-${{ github.sha }} \
            --region=us-central1 \
            --cpu=1 \
            --memory=512Mi \
            --min-instances=0 \
            --max-instances=3 \
            --concurrency=80 \
            --platform=managed \
            --allow-unauthenticated

      - name: Mostrar URL del frontend deployado
        run: |
          gcloud run services describe guau-frontend-staging --region=us-central1 --format='value(status.url)'