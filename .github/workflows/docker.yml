name: CI/CD - Guau

on:
  push:
    branches: [master]

concurrency:
  group: guau-deploy
  cancel-in-progress: false

jobs:
  # -- 0. Correr tests (gate del pipeline) --------------------------------------
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Generar cliente de Prisma (necesario para compilar, aunque los tests mockeen PrismaService)
        run: npm run prisma:generate --workspace=apps/api

      - name: Tests backend (apps/api)
        run: npm test --workspace=apps/api

      - name: Tests frontend (apps/web)
        run: npm test --workspace=apps/web

  # -- 1. Build & push imagen API -----------------------------------------------
  build-api:
    name: Build API image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/joaoboy89/guau-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # -- 2. Build & push imagen Web -----------------------------------------------
  build-web:
    name: Build Web image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: true
          platforms: linux/amd64
          tags: ghcr.io/joaoboy89/guau-web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://guauapi.jbsaasapp.com
            NEXT_PUBLIC_WS_URL=http://38.54.57.20:3001
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # -- 3. Deploy al VPS via SSH -------------------------------------------------
  deploy:
    name: Deploy to VPS
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync docker-compose al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infra/vps/docker-compose.yml"
          target: "/opt/guau/"
          strip_components: 2

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: "30m"
          script: |
            set -euo pipefail
            cd /opt/guau

            echo "Bajando imagenes..."
            docker pull ghcr.io/joaoboy89/guau-api:latest
            docker pull ghcr.io/joaoboy89/guau-web:latest

            echo "Levantando servicios..."
            docker compose up -d --remove-orphans

            echo "Limpiando imagenes viejas..."
            docker image prune -f

            echo "Deploy completado - API :3001 Web :3000"
